name: 'CI'

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d authcore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Backend lint
        run: pnpm lint:check

      - name: Run test migrations
        run: pnpm migration:run:test

      - name: Backend tests
        run: pnpm test

      - name: Backend build
        run: pnpm build

  frontend:
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Frontend lint
        run: pnpm --filter demo-frontend lint

      - name: Frontend build
        run: pnpm --filter demo-frontend build
