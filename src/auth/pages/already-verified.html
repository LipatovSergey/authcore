<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Already Verified</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --surface: #ffffff;
        --text: #18212f;
        --muted: #5f6b7a;
        --border: #d7dde5;
        --accent: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(180deg, #f9fafb 0%, var(--bg) 100%);
        font-family:
          "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
      }

      .card {
        width: min(100%, 560px);
        padding: 32px 28px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 12px 40px rgba(18, 33, 52, 0.08);
      }

      .badge {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        margin-bottom: 20px;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.12);
        color: var(--accent);
        font-size: 24px;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 5vw, 36px);
        line-height: 1.1;
      }

      p {
        margin: 0;
        font-size: 16px;
        line-height: 1.6;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">i</div>
      <h1>Email already verified</h1>
      <p>This email address has already been verified. You can return to the application and continue using your account.</p>
    </main>
  </body>
</html>
